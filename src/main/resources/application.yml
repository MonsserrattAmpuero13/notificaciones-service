server:
  port: 8081

spring:
  application:
    name: notificaciones-service
  autoconfigure:
    exclude:
      # Kafka propio: se desactiva la integracion de Azure con Event Hubs (no se usa y busca clases que no existen)
      - com.azure.spring.cloud.autoconfigure.implementation.kafka.AzureEventHubsKafkaOAuth2AutoConfiguration
      - com.azure.spring.cloud.autoconfigure.implementation.kafka.AzureEventHubsKafkaAutoConfiguration
  cloud:
    azure:
      servicebus:
        connection-string: ${SERVICEBUS_CONNECTION_STRING}

app:
  servicebus:
    topic: pedidos-topic
    subscription: notificaciones-sub
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    topic:
      pedidos-creados: pedidos-creados
      alertas-stock: alertas-stock
    group:
      notificaciones: ${KAFKA_GROUP_NOTIFICACIONES:notificaciones-group}
      alertas: ${KAFKA_GROUP_ALERTAS:alertas-stock-group}
